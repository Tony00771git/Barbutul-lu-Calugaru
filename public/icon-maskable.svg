<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGradMask" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#2a1a0e"/>
      <stop offset="70%" stop-color="#140c06"/>
      <stop offset="100%" stop-color="#0a0603"/>
    </radialGradient>
    <linearGradient id="goldGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe680"/>
      <stop offset="50%" stop-color="#e8c84a"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
    <linearGradient id="beerGradMask" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <filter id="glowMask" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed edge-to-edge solid background (No rounded corners, essential for Android Adaptive Maskable Icon) -->
  <rect width="512" height="512" fill="url(#bgGradMask)"/>

  <!-- Inner Safe Zone Group (Scaled to 76% and centered at (256, 256) so no graphic elements are clipped/hidden by Android squircle/circle masks) -->
  <g transform="translate(61.44, 61.44) scale(0.76)">
    <!-- Golden Circular Arch / Halo -->
    <circle cx="256" cy="256" r="190" fill="none" stroke="url(#goldGradMask)" stroke-width="6" stroke-dasharray="10 8" opacity="0.75"/>

    <!-- Beer Stein Mug -->
    <g transform="translate(0, 10)" filter="url(#glowMask)">
      <!-- Handle -->
      <path d="M 330 210 C 410 210, 410 350, 330 350" fill="none" stroke="url(#goldGradMask)" stroke-width="26" stroke-linecap="round"/>

      <!-- Stein Body -->
      <path d="M 170 180 L 180 390 C 180 405, 330 405, 330 390 L 340 180 Z" fill="url(#beerGradMask)" stroke="url(#goldGradMask)" stroke-width="12" stroke-linejoin="round"/>

      <!-- Foam Head -->
      <path d="M 155 180 C 145 150, 185 130, 205 150 C 220 125, 260 120, 280 145 C 300 125, 345 135, 345 160 C 365 160, 370 195, 340 200 C 310 200, 170 200, 155 180 Z" fill="#ffffff" stroke="#f0ebe0" stroke-width="6"/>

      <!-- Foam Drips -->
      <path d="M 190 195 C 190 230, 205 230, 205 195" fill="#ffffff"/>
      <path d="M 270 195 C 270 245, 285 245, 285 195" fill="#ffffff"/>

      <!-- Celtic / Monastery Cross on Mug -->
      <g transform="translate(255, 295)" stroke="#ffe680" stroke-width="6" stroke-linecap="round" fill="none">
        <circle cx="0" cy="0" r="22" stroke="#ffe680" stroke-width="4" opacity="0.8"/>
        <line x1="0" y1="-32" x2="0" y2="32"/>
        <line x1="-30" y1="0" x2="30" y2="0"/>
      </g>

      <!-- Dice details -->
      <g transform="translate(135, 350) rotate(-15)">
        <rect width="60" height="60" rx="12" fill="#241408" stroke="url(#goldGradMask)" stroke-width="4"/>
        <circle cx="30" cy="30" r="5" fill="#ffe680"/>
        <circle cx="16" cy="16" r="5" fill="#ffe680"/>
        <circle cx="44" cy="44" r="5" fill="#ffe680"/>
      </g>
      <g transform="translate(325, 360) rotate(15)">
        <rect width="60" height="60" rx="12" fill="#241408" stroke="url(#goldGradMask)" stroke-width="4"/>
        <circle cx="18" cy="18" r="5" fill="#ffe680"/>
        <circle cx="42" cy="18" r="5" fill="#ffe680"/>
        <circle cx="18" cy="42" r="5" fill="#ffe680"/>
        <circle cx="42" cy="42" r="5" fill="#ffe680"/>
      </g>
    </g>
  </g>
</svg>
